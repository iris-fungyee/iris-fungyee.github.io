<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel</title>
    <link rel="stylesheet" href="css/relative-travel.css">
</head>
<body>

<div id="container">
    <div class="travelcontainer">
        <div>
            <div class="card">
            <img class="card-image" src="images/greecein.jpg" alt="greece" width="100%" height="auto">
            <div>
                <h1>Trip to Greece</h1>
                <p>14 - 29 June| by Robbin Williams</p>
            </div>
            <div class="icons">
                <img src="images/leaf.png" alt="leaf" width="24" height="24">
                <img src="images/map.png" alt="map" width="24" height="24">
                <img src="images/navi.png" alt="navi" width="24" height="24">
            </div>
            <div class="building">
                <p class="people"><img src="images/building.png" alt="building" width="24" height="24">24 people going</p>
                <div><img src="images/heart.png" alt="heart" width="24" height="24"></div>
            </div>
            </div>
            <div class="absolute"> 
            <img class="rome" src="images/romeout.jpg" alt="rome" width="50" height="50">
            <div class="rome_content">
                <p>Ongoing</p>
                <h2>Trip to rome</h2>
                <p><span class="progress-no">40%</span><span class="progress-text"> completed</span></p>
                <div class="progress_bar">
                    <div>40%</div>
                </div>
            </div>
            </div>
        </div>

        <div>
            <div class="card">
            <img class="card-image" src="images/greeceout.jpg" alt="greece" width="100%" height="auto">
            <div>
                <h1>Trip to Greece</h1>
                <p>14 - 29 June| by Robbin Williams</p>
            </div>
            <div class="icons">
                <img src="images/leaf.png" alt="leaf" width="24" height="24">
                <img src="images/map.png" alt="map" width="24" height="24">
                <img src="images/navi.png" alt="navi" width="24" height="24">
            </div>
            <div class="building">
                <p class="people"><img src="images/building.png" alt="building" width="24" height="24">24 people going</p>
                <div><img src="images/heart.png" alt="heart" width="24" height="24"></div>
            </div>
            </div>
            <div class="absolute"> 
            <img class="rome" src="images/romein.jpg" alt="rome" width="50" height="50">
            <div class="rome_content">
                <p>Ongoing</p>
                <h2>Trip to rome</h2>
                <p><span class="progress-no">40%</span><span class="progress-text"> completed</span></p>
                <div class="progress_bar">
                    <div>40%</div>
                </div>
            </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
