<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel</title>
</head>
<body>

<div id="container">
    <div class="relative_container">
        <div class="card">
            <img src="images/greecein.jpg" alt="greece" width="100%" height="auto">
            <div>
                <h1>Trip to Greece</h1>
                <p>14 - 29 June| by Robbin Williams</p>
            </div>
            <div>
                <img src="images/leaf.png" alt="leaf" width="24" height="24">
                <img src="images/map.png" alt="map" width="24" height="24">
                <img src="images/navi.png" alt="navi" width="24" height="24">
            </div>
            <div class="building">
                <p><img src="images/building.png" alt="building" width="24" height="24">24 people going</p>
                <div><img src="images/heart.png" alt="heart" width="24" height="24"></div>
            </div>
        <div class="overlap"> 
            <img src="images/romeout.jpg" alt="rome" width="100%" height="auto">
            <div class="rome_content">
                <div>Ongoing</div>
                <h2>Trip to rome</h2>
                <p>40% completed</p>
                <div class="progress_bar"></div>
            </div>
        </div>
       
        </div>
    </div>
</div>
</body>
</html>
