<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
    <link rel="stylesheet" href="../css/common/variables.css">
    <link rel="stylesheet" href="../css/common/header.css">
    <link rel="stylesheet" href="../css/common/form-element.css">
</head>

<body>
    <div class="header">
        <div class="top header">
            <div class="search-container">
                <img src="../images/searchicon.png" alt="search" width="18" height="18">
                <input type="text" id="search" name="search" placeholder="Search...">
            </div>

            <div class="logo">
                Avada Handmade
            </div>

            <div class="icon">
                <div class="account">
                    <img src="../images/account.png" alt="account icon" width="24px" height="auto">
                </div>
                <div class="cart">
                    <img src="../images/shoppingcart.png" alt="shopping cart" width="24px" height="auto">
                </div>
            </div>
        </div>
        <div class="bottomheader">
            <div class="navigationmenu">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#shop">Shop</a>
                <div class="dropdown">
                    <a href="#product">Product</a>
                    <img src="../images/dropdown-arrow.svg" alt="dropdown-aarow" width="10px" height="auto">
                    <div class="dropdown-content">
                        <a href="#product1">Small terrarium kit</a>
                        <a href="#product2">Mask</a>
                    </div>
                </div>
                <a href="#blog">Blog</a>
                <a href="#contact">Contact</a>

            </div>
        </div>
    </div>
</body>

</html>
