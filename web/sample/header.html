<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
    <script src="https://kit.fontawesome.com/6cc981b743.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/common/variables.css">
    <link rel="stylesheet" href="../css/common/header.css">
    <link rel="stylesheet" href="../css/common/form-element.css">
    <link rel="stylesheet" href="../css/common/font.css">
    <link rel="stylesheet" href="../css/common/icon.css">

</head>

<body>
    <div class="header">
        <div class="topheader">
            <div class="search-container">
                <img src="../images/searchicon.png" alt="search" width="18" height="18">
                <input type="text" id="search" name="search" placeholder="Search...">
            </div>
            <div class="three-dot-menu">
                <img src="../images/3-dotted-navigation.png" alt="3 dotted menu" width="20px" height="auto">
            </div>
            <div class="logo-header">Avada Handmade</div>

            <div class="-header-icon">
                <div class="icon">
                    <img src="../images/account.png" alt="account icon" width="24px" height="auto">
                </div>
                <div class="icon">
                    <img src="../images/basket.png" alt="shopping cart" width="24px" height="auto">
                </div>
            </div>
        </div>
        <div class="bottomheader">
            <div class="navigationmenu">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#shop">Shop</a>
                <div class="dropdown-section">
                    <div class="header-dropdown"><a href="#">Products
                            <i class="fa-solid fa-angle-down"></i>
                        </a></div>
                    <div class="dropdown-content">
                        <a href="#product1">Small terrarium kit</a>
                        <a href="#product2">Mask</a>
                    </div>
                </div>
                <a href="#blog">Blog</a>
                <a href="#contact">Contact</a>

            </div>
        </div>
    </div>
</body>

</html>
