<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icons</title>
        <script src="https://kit.fontawesome.com/6cc981b743.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="../css/common/variables.css">
        <link rel="stylesheet" href="../css/common/icon.css">
        <link rel="stylesheet" href="../css/common/font.css">
        <link rel="stylesheet" href="../css/common/link.css">

</head>
<body>

<div class="usp-section">
    <div class="usp-content">
        <div class="usp-head">
            <div>
                <img src="../images/time.png" alt="time" width="24" height="24">
            </div>
            <div class="usp-body">
                <div>
                    <h2 class="domine usp-title">Free returns</h2>
                </div>
                <div>
                    <p class="homepage-sub">You can ask a refund anytime</p>
                </div>
            </div>
        </div>
    </div>

    <div class="usp-content">
        <div class="usp-head">
            <div>
                <img src="../images/basket.png" alt="basket" width="24" height="24">
            </div>
            <div class="usp-body">
                <div>
                    <h2 class="domine usp-title">Secure packaging</h2>
                </div>
                <div>
                    <p class="homepage-sub">Your items will arrive in one piece</p>
                </div>
            </div>
        </div>
    </div>

    <div class="usp-content">
        <div class="usp-head">
            <div>
                <img src="../images/payment.png" alt="payment" width="24" height="24">
            </div>
            <div class="usp-body">
                <div>
                    <h2 class="domine usp-title">Free shipping</h2>
                </div>
                <div>
                    <p class="homepage-sub">Don’t pay extra fees for your delivery</p>
                </div>
            </div>
        </div>
    </div>

    <div class="usp-content">
        <div class="usp-head">
            <div>
                <img src="../images/dollarsign.png" alt="dollar" width="16" height="20">
            </div>
            <div class="usp-body">
                <div>
                    <h2 class="domine usp-title">Best discounts</h2>
                </div>
                <div>
                    <p class="homepage-sub">We give you the best price guarantee</p>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="productpg-socials">
    <p class="categories-sub"><a class="share-icon fb fb-color link-static" href="#">Share this</a></p>
    <p class="categories-sub"><a class="share-icon x link-static" href="#">Tweet this</a></p>
    <p class="categories-sub"><a class="share-icon email link-static" href="#">Email this</a></p>
</div>

<div class="customerreview-sub">
    <div class="five-stars">
         <img src="../images/fivestars.png" alt="time" width="90" height="18">
    </div>
    <p>(1 customer review)</p>
</div>

<div class="contactpg-socials">
    <h1 class="domine form-title">Follow us</h1>
    <div class="social-links">
        <a class="socials-icon fb link-static" href="https://www.facebook.com/ThemeFusionAvada#"></a>
        <a class="socials-icon x link-static" href="https://x.com/theme_fusion"></a>
        <a class="socials-icon ig link-static" href="https://www.instagram.com/themefusion/"></a>
        <a class="socials-icon yt link-static" href="https://www.youtube.com/channel/UC_C7uAOAH9RMzZs-CKCZ62w"></a>
    </div>
</div>
    
</body>
</html>
