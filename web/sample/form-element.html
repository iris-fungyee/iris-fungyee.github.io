<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Element</title>
    <link rel="stylesheet" href="../css/common/variables.css">
    <link rel="stylesheet" href="../css/common/form-element.css">
    <link rel="stylesheet" href="../css/common/font.css">
</head>
<body>
    <div class="search-container">
        <img src="../images/searchicon.png" alt="search" width="18" height="18">
        <input type="text" id="search" name="search" placeholder="Search...">
    </div>

<section>
    <div class="subscribe-section">
        <div class="subscribe-header">
            <h2 class="categories-title">Subscribe to our newsletter to receive updates.</h2>
            <p class="categories-sub">We will only send you the good stuff, no spam. *</p>
        </div>

        <form class="subscribe-form">
            <input type="text" id="yourname" name="yourname" placeholder="Your name ...">
            <input type="email" id="youremail" name="youremail" placeholder="Your email ...">
            <button type="submit">Subscribe</button>
         </form>
    </div>
</section>

</body>
</html>
