<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <link rel="stylesheet" href="../css/common/layout.css">
    <link rel="stylesheet" href="../css/common/font.css">
    <link rel="stylesheet" href="../css/common/variables.css">
    <link rel="stylesheet" href="../css/common/form-element.css">
</head>

<body>
    <div class="row-column max-width">
        <div class="column-one content-center padding-default background-color">1
        </div>
    </div>

    <div class="row-column max-width">
        <div class="column-two content-center padding-default background-color">Two Columns on Desktop<br>One Column on
            Table/Mobile
        </div>
        <div class="column-two content-center padding-default background-color">2</div>
    </div>

    <div class="row-column max-width">
        <div class="column-three content-center padding-default background-color">Three Columns on Desktop <br>
            Two Column on Tablet <br>
            One Column on Mobile</div>
        <div class="column-three content-center padding-default background-color">2</div>
        <div class="column-three content-center padding-default background-color disappear">3</div>
    </div>

    <div class="row-column max-width">
        <div class="column-four content-center padding-default background-color">Four Columns on Desktop/Tablet/Mobile
        </div>
        <div class="column-four content-center padding-default background-color">2</div>
        <div class="column-four content-center padding-default background-color">3</div>
        <div class="column-four content-center padding-default background-color">4</div>
    </div>

    <div class="row-column max-width">
        <div class="column-six content-center padding-default background-color">Six Columns on Desktop/Tablet <br>
            2 Column on Mobiles</div>
        <div class="column-six content-center padding-default background-color">2</div>
        <div class="column-six content-center padding-default background-color">3</div>
        <div class="column-six content-center padding-default background-color">4</div>
        <div class="column-six content-center padding-default background-color">5</div>
        <div class="column-six content-center padding-default background-color">6</div>
    </div>

    <div class="row-column max-width card">
        <div class="column content-center padding-default background-color">1</div>
        <div class="row-column">
            <div class="column-two row-column-two content-center padding-default background-color">2</div>
            <div class="column-two row-column-two content-center padding-default background-color">3</div>
        </div>
    </div>

    <div class="row-column max-width card">
        <div class="row-column">
            <div class="column-two row-column-two content-center padding-default background-color">1</div>
            <div class="column-two row-column-two content-center padding-default background-color">2</div>
        </div>
        <div class="column content-center padding-default background-color">3</div>
    </div>

</body>

</html>
